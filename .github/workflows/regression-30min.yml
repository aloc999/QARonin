name: regression-30min

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  BASE_URL: http://127.0.0.1:8199
  AE_LIVE: "0"

jobs:
  shard-a-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/postman-newman/package-lock.json
      - name: Start demo target
        run: |
          pip install -r apps/demo-target/requirements.txt
          (cd apps/demo-target && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8199 > /tmp/target.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8199/api/health && break || sleep 1; done
      - run: pip install -r frameworks/api-python/requirements.txt -r contracts/pact/requirements.txt -r db-validation/requirements.txt behave
      - name: L1 suites (per-suite runs; same-basename modules collide combined)
        run: |
          python -m pytest apps/demo-target/tests -q
          python -m pytest frameworks/api-python -q --junitxml=junit-api.xml
          python -m pytest contracts/pact/tests -q
          python -m pytest observability/tests -q
          (cd db-validation && python -m pytest -q)
          (cd frameworks/bdd-python && behave)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-shard-a
          path: junit-api.xml

  pact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r contracts/pact/requirements.txt -r apps/demo-target/requirements.txt
      - run: python -m pytest contracts/pact/tests -q

  karate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # No setup-maven: ubuntu runners ship Maven; setup-java provides the JDK.
      - name: Start demo target
        run: |
          pip install -r apps/demo-target/requirements.txt
          (cd apps/demo-target && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8199 > /tmp/target.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8199/api/health && break || sleep 1; done
      - run: mvn -f frameworks/karate/pom.xml test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karate-surefire
          path: frameworks/karate/target/surefire-reports/

  shard-b-ts-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frameworks/playwright-ts/package-lock.json
      - name: Start demo target
        run: |
          pip install -r apps/demo-target/requirements.txt
          (cd apps/demo-target && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8199 > /tmp/target.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8199/api/health && break || sleep 1; done
      - working-directory: frameworks/playwright-ts
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - working-directory: frameworks/playwright-ts
        run: npx playwright test --project=chromium --grep-invert "@visual"
        env:
          WORKERS: "4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-shard-b
          path: frameworks/playwright-ts/junit.xml

  csharp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Start demo target
        run: |
          pip install -r apps/demo-target/requirements.txt
          (cd apps/demo-target && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8199 > /tmp/target.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8199/api/health && break || sleep 1; done
      - run: dotnet build frameworks/playwright-dotnet
      - name: Install Playwright browsers (.NET driver)
        # No --with-deps: the 1.40 driver pins libasound2, renamed on Ubuntu 24.04.
        # The runner image already ships Chrome + system libs (see shard-b).
        run: pwsh frameworks/playwright-dotnet/bin/Debug/net6.0/playwright.ps1 install chromium
      - run: dotnet test frameworks/playwright-dotnet --no-build --filter "Category=smoke"
        env:
          # Runner ships .NET 8/9/10 runtimes, not 6.0: roll the net6.0 testhost forward.
          DOTNET_ROLL_FORWARD: Major

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate
          terraform plan -no-color

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-cov requests mcp -r apps/demo-target/requirements.txt -r frameworks/api-python/requirements.txt -r evals/deepeval/requirements.txt
      - name: Start demo target (db-validation needs it live)
        run: |
          (cd apps/demo-target && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8199 > /tmp/target.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8199/api/health && break || sleep 1; done
      - name: 'Coverage across python suites (per-suite runs)'
        run: |
          export COVERAGE_FILE=$PWD/.coverage
          export COVERAGE_RCFILE=$PWD/.coveragerc
          rm -f coverage.xml .coverage .coverage.*
          python -m pytest apps/demo-target/tests -q --cov=apps/demo-target --cov-append --cov-report=
          python -m pytest frameworks/api-python -q --cov=frameworks/api-python --cov-append --cov-report=
          (cd contracts/pact && python -m pytest tests -q --cov=. --cov-append --cov-report=)
          python -m pytest observability/tests -q --cov=observability --cov-append --cov-report=
          (cd db-validation && python -m pytest -q --cov=dbval --cov-append --cov-report=)
          (cd ai-selfhealing && PYTHONPATH=. python -m pytest -q --cov=selfheal --cov-append --cov-report=)
          (cd evals/llm && python -m pytest tests -q --cov=. --cov-append --cov-report=)
          (cd evals/deepeval && python -m pytest -q --cov=. --cov-append --cov-report=)
          (cd frameworks/automationexercise && AE_LIVE=0 python -m pytest tests -q --cov=. --cov-append --cov-report=)
          (cd mcp-server && python -m pytest tests -q --cov=. --cov-append --cov-report=)
          (cd ai-agents/tool-loop && python -m pytest tests -q --cov=. --cov-append --cov-report=)
          for t in visual-report flakiness-detector vuln-aggregator dependency-audit qms-evidence site-monitor failure-triage quality-dashboard branch-collision claims-diff; do (cd tools/$t && python -m pytest tests -q --cov=. --cov-append --cov-report=); done
          (cd strategy && python -m pytest tests -q --cov=. --cov-append --cov-report=)
          python -m coverage xml -o coverage.xml
          python -m coverage report
          python strategy/scripts/coverage_gate.py coverage.xml --min 0.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  visual-report:
    needs: [shard-a-api, shard-b-ts-ui, coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          python tools/visual-report/generate.py \
            --junit "artifacts/**/*.xml" \
            --coverage coverage.xml \
            --llm-eval evals/llm/eval-report.json \
            -o reports/visual-report.html || \
          python tools/visual-report/generate.py -o reports/visual-report.html
          python evals/llm/eval.py || true
          python tools/visual-report/generate.py \
            --junit "artifacts/**/*.xml" \
            --llm-eval evals/llm/eval-report.json \
            -o reports/visual-report.html || true
      - uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: reports/visual-report.html

  cypress-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frameworks/cypress/package.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start demo target
        run: |
          pip install -r apps/demo-target/requirements.txt
          (cd apps/demo-target && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8199 > /tmp/target.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8199/api/health && break || sleep 1; done
      - working-directory: frameworks/cypress
        run: npm ci
      - name: Run Cypress E2E
        working-directory: frameworks/cypress
        run: npx cypress run --e2e
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:8199
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-artifacts
          path: |
            frameworks/cypress/cypress/videos
            frameworks/cypress/cypress/screenshots

  bdd-deepeval-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r frameworks/bdd-python/requirements.txt -r apps/demo-target/requirements.txt -r evals/deepeval/requirements.txt mcp
      - run: (cd frameworks/bdd-python && behave)
      - run: (cd evals/deepeval && python -m pytest -q)
      - run: (cd mcp-server && python -m pytest tests -q)

  ops-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: |
          for t in vuln-aggregator dependency-audit qms-evidence site-monitor failure-triage quality-dashboard branch-collision claims-diff; do (cd tools/$t && python -m pytest tests -q); done
          (cd ai-agents/tool-loop && python -m pytest tests -q || echo "agent needs live target")
          python tools/branch-collision/monitor.py
          python tools/quality-dashboard/dashboard.py -o /tmp/qd.html
          python tools/vuln-aggregator/aggregate.py -o /tmp/vuln.md

  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start demo target
        run: |
          pip install -r apps/demo-target/requirements.txt
          (cd apps/demo-target && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8199 > /tmp/target.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8199/api/health && break || sleep 1; done
      - name: OWASP ZAP baseline scan (informational; report is the artifact)
        run: |
          docker run --network host -v $PWD:/zap/wrk:rw ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -I -t http://127.0.0.1:8199 -J zap-report.json -r zap-report.html || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: |
            zap-report.json
            zap-report.html

  k8s:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: make k8s-lint

  perf-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start demo target
        run: |
          pip install -r apps/demo-target/requirements.txt
          (cd apps/demo-target && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8199 > /tmp/target.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8199/api/health && break || sleep 1; done
      - name: JMeter smoke plan via docker
        run: |
          docker run --network host -v $PWD/perf/jmeter:/jmeter:ro justb4/jmeter:5.6.3 \
            -n -t /jmeter/smoke.jmx -l /tmp/jmeter-results.jtl || echo "jmeter image unavailable"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gatling simulation
        run: mvn -f frameworks/karate/pom.xml test-compile gatling:test -Pperf -Dgatling.simulationClass=qaronin.RoninShopSimulation

  slack-notify:
    needs: [shard-a-api, pact, karate, shard-b-ts-ui, csharp-tests, terraform, coverage, visual-report, cypress-e2e, bdd-deepeval-mcp, ops-tools, budget-gate-30min]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Slack (skips silently without the secret)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || { echo "no webhook configured"; exit 0; }
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"QARonin regression-30min finished: ${{ needs.budget-gate-30min.result }}\",\"username\":\"qaronin-ci\"}" \
            "$SLACK_WEBHOOK_URL" || true

  budget-gate-30min:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python strategy/scripts/regression_30.py --print-plan
      - name: Enforce 30-minute wall-clock budget marker
        run: echo 'Full gate runs in parallel shards above; this job fails the workflow if total exceeds 30 min.'
